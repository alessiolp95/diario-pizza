<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diario pizza">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f0e8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<title>Diario Pizza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: una colonna stretta da telefono; barra di navigazione in basso; form in bottom-sheet. */
:root{
  --bg:#f4f0e8;
  --surface:#ffffff;
  --ink:#221c17;
  --muted:#6e655b;
  --line:#e3ddd2;
  --accent:#b23a2b;
  --accent-ink:#ffffff;
  --crust:#c0832f;
  --basil:#3f6b45;
  --danger:#a23a2a;
  --font-display:"Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --font-body:"IBM Plex Sans", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --radius:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14110f; --surface:#1e1a17; --ink:#eee8e1; --muted:#a59b90; --line:#302a25;
    --accent:#e87a68; --accent-ink:#1d0f0c; --crust:#e0ab62; --basil:#8fbf94; --danger:#e07a68;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden;overscroll-behavior-x:none;max-width:100%}
html{-webkit-text-size-adjust:100%}
img,input,select,textarea,button{max-width:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px calc(110px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px;overflow-x:hidden}
.wrap > *, .sheet > *, form > *{min-width:0}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-0.01em}
h1{font-size:30px;font-weight:700;line-height:1.1}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top p{margin:4px 0 0;color:var(--muted);font-size:14px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:500;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;touch-action:manipulation}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:transparent;background:transparent;padding-left:0}
.btn.ghost{background:transparent;border-color:transparent;padding-left:0}
.btn.small{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px}

/* tipi di impasto */
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.types a,.types button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:10px;text-decoration:none;font-size:14px;font-weight:500;color:var(--muted);border:0;background:transparent;cursor:pointer;touch-action:manipulation}
.types svg{width:26px;height:26px}
.types [aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.lead{margin:-6px 0 0;color:var(--muted);font-size:14px}

/* risultati */
.res{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:12px}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px}
@media (max-width:380px){.res-grid{grid-template-columns:repeat(2,1fr)}}
.res-grid > div{display:flex;flex-direction:column;min-width:0}
.rl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.rv{font-size:22px;font-weight:500;line-height:1.2;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.u{font-family:var(--font-body);font-size:.68em;color:var(--muted);margin-left:2px}
.res-grid .yeast{grid-column:1/-1;background:color-mix(in srgb,var(--accent) 9%,var(--surface));border-radius:10px;padding:8px 10px;flex-direction:row;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 12px}
.res-grid .yeast .rv{color:var(--accent);font-size:26px}
.yk{display:inline-flex;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:999px;padding:2px;background:var(--surface)}
.yk button{border:0;background:transparent;border-radius:999px;padding:5px 14px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;touch-action:manipulation;min-height:32px}
.yk button[aria-checked="true"]{background:var(--accent);color:var(--accent-ink)}
.ytop{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;flex-wrap:wrap}
details.adv{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.adv > summary{cursor:pointer;list-style:none;padding:12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
details.adv > summary::-webkit-details-marker{display:none}
details.adv > summary .st{font-size:13px;color:var(--muted);text-align:right}
details.adv > summary .st.on{color:var(--accent);font-weight:500}
details.adv > summary b{font-weight:500}
details.adv > summary b::before{content:"▸ ";display:inline-block;width:1em;color:var(--muted)}
details.adv[open] > summary b::before{content:"▾ "}
details.adv .in{display:flex;flex-direction:column;gap:10px;padding:0 10px 10px}
details.adv .sl{background:var(--bg)}
details.adv .sl .seg button{background:var(--surface)}
details.adv .sl .seg button[aria-checked="true"]{background:var(--accent)}
.res-meta{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.res-meta b{color:var(--ink);font-weight:500}
.tip{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:14px;margin:0}
.mini{position:fixed;left:0;right:0;top:0;z-index:15;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 16px 8px;transform:translateY(-110%);transition:transform .18s ease-out}
.mini.on{transform:none}
.mini .in{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;gap:8px;font-size:13px}
.mini .in div{display:flex;flex-direction:column;min-width:0}
.mini .in b{font-family:var(--font-mono);font-weight:500;font-size:15px}
.mini .in .y b{color:var(--accent)}

/* controlli */
.group{display:flex;flex-direction:column;gap:10px}
.group > h3{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.06em;font-family:var(--font-body);font-weight:600;margin-top:4px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.flabel,.field > label{font-size:13px;font-weight:500;color:var(--muted)}
.sl{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;gap:6px}
.sl-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sl-head label{font-size:14px;color:var(--ink);font-weight:500}
.sl-head output{font-size:19px;font-weight:600;white-space:nowrap;font-family:var(--font-body)!important;font-variant-numeric:tabular-nums}
.sl-row{display:grid;grid-template-columns:40px 1fr 40px;gap:10px;align-items:center}
.sl-row input[type=range]{width:100%;min-width:0;touch-action:pan-y;accent-color:var(--accent);height:32px;margin:0}
.sl-row input[type=range]:disabled{opacity:.4}
.step{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1;cursor:pointer;touch-action:manipulation}
.step:active{background:var(--line)}
.hint{font-size:12px;color:var(--muted);margin:0}
.hint:empty{display:none}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-size:15px;cursor:pointer;touch-action:manipulation}
.seg button[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.sl .seg button{background:var(--bg)}
.sl .seg button[aria-checked="true"]{background:var(--accent)}
.prefill{display:flex;flex-wrap:wrap;gap:8px}
.prefill:empty{display:none}

/* liste */
.list{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--muted)}
.thumb{width:72px;height:72px;border-radius:10px;object-fit:cover;background:var(--bg);display:block}
.thumb.ph{display:grid;place-items:center;color:var(--muted)}
.card .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.card .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .name{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.card .sub{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.card .meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.card .note1{font-size:14px;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.pill.warn{color:var(--crust);border-color:color-mix(in srgb,var(--crust) 45%,transparent)}
.pill.tag{color:var(--basil);border-color:color-mix(in srgb,var(--basil) 40%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;touch-action:manipulation}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:0 0 auto}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:24px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 12px}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.notice p{margin:0}
.stars{color:var(--crust);letter-spacing:1px;font-size:15px;white-space:nowrap}
.stars .off{color:var(--line)}

/* gusti */
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column}
.gcard:hover{border-color:var(--muted)}
.gcard .ph,.gcard img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--bg)}
.gcard .ph{display:grid;place-items:center;color:var(--muted)}
.gcard .b{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px}
.gcard .name{font-weight:600;overflow-wrap:anywhere}
.gcard .meta{display:flex;flex-wrap:wrap;gap:4px}

/* dettaglio */
.hero-img{width:100%;max-height:340px;object-fit:cover;border-radius:12px;display:block;background:var(--surface)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px 16px;margin:0}
.facts div{display:flex;flex-direction:column}
.facts dt{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.facts dd{margin:0;font-weight:500}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:1fr 110px 28px;gap:8px;align-items:center;font-size:14px}
.bar .tr{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--crust)}
.prose{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.box.tips{border-left:4px solid var(--basil)}
.box ul{margin:0;padding-left:18px}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;border-radius:18px 18px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:18px;max-height:88%}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:-18px;background:var(--bg);padding:6px 0;z-index:1}
form{display:flex;flex-direction:column;gap:14px}
input[type=text],input[type=datetime-local],textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;min-height:44px;
}
input[type=datetime-local]{-webkit-appearance:none;appearance:none;display:block;min-width:0;text-align:left}
textarea{min-height:96px;resize:vertical;line-height:1.45}
.addrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.addrow input{min-height:38px;padding:6px 10px;font-size:15px}
.rating{display:flex;gap:6px}
.rating button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;color:var(--line);cursor:pointer}
.rating button.on{color:var(--crust);border-color:color-mix(in srgb,var(--crust) 50%,var(--line))}
.photo-pick{border:1px dashed var(--line);border-radius:var(--radius);background:var(--surface);min-height:110px;display:grid;place-items:center;cursor:pointer;overflow:hidden;position:relative;color:var(--muted);text-align:center;padding:0}
.photo-pick img{width:100%;max-height:240px;object-fit:cover;display:block}
.photo-pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.form-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.summary{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.summary b{font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:90%}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-top:16px;border-top:1px solid var(--line)}
.foot .who{width:100%;text-align:center;font-size:13px;color:var(--muted)}
.login{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.login .err{color:var(--danger);margin:0;font-size:14px}
input[type=password]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;min-height:44px}
.nudge{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--crust);border-radius:12px;padding:10px 12px;font-size:14px}
.seg.days{flex-wrap:nowrap}
.seg.days button{flex:1 1 0;min-width:0;padding:6px 2px;font-size:14px;white-space:nowrap}
.card.rm{grid-template-columns:28px 1fr;padding:10px 12px}
.rm-check{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:15px;font-weight:600;color:var(--accent-ink)}
.card.rm[aria-pressed="true"] .rm-check{background:var(--accent);border-color:var(--accent)}
.card.rm[aria-pressed="false"] .name{color:var(--muted)}
.card.rm:disabled{opacity:.5;cursor:default}
details.how ol{margin:8px 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
details.how .btn{margin-top:4px}
details.how{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
details.how summary{cursor:pointer;font-weight:500}
details.how p{margin:8px 0 0;color:var(--muted)}

/* barra in basso */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 96%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabbar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:12px;font-weight:500;color:var(--muted);text-decoration:none;border-radius:10px;touch-action:manipulation}
.tabbar a svg{width:24px;height:24px}
.tabbar a[aria-current="page"]{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
@media (prefers-reduced-motion:reduce){.mini{transition:none}}
</style>
</head>
<body>
<div class="mini" id="mini" aria-hidden="true"><div class="in" id="mini-in"></div></div>
<main class="wrap" id="app"></main>
<nav class="tabbar" id="nav" aria-label="Sezioni"></nav>

<script src="config.js"></script>
<script src="vendor/supabase-2.117.3.js"></script>
<script>
(() => {
"use strict";

/* ================= icone ================= */
const IC = {
  tonda:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="6.3"/><circle cx="10" cy="10" r="1"/><circle cx="14.5" cy="11" r="1"/><circle cx="11.5" cy="14.5" r="1"/></svg>',

  teglia:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="1.5"/><rect x="5" y="8" width="14" height="8" rx="1"/><circle cx="9" cy="11" r=".9"/><circle cx="14" cy="13" r=".9"/></svg>',
  pane:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 15c0-4.5 4-8 9-8s9 3.5 9 8c0 1.7-1.3 3-3 3H6c-1.7 0-3-1.3-3-3Z"/><path d="M8 9.5l1.5 3M12 8.8v3.4M16 9.5l-1.5 3"/></svg>',
  registro:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>',
  gusti:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 3 3.5 19.5c5.4 2 11.6 2 17 0Z"/><circle cx="11" cy="12" r="1.2"/><circle cx="14" cy="16" r="1.2"/><circle cx="9" cy="17" r="1.2"/></svg>',

/* ================= formule (dal Calcolapizza 2.1) ================= */
function totalDough(t, v){
  if (t === "teglia"){
    const area = v.shape === "tonda" ? Math.PI * Math.pow(v.diam/2, 2) : v.length * v.width;
    return area * v.load * v.count;
  }
  return v.count * v.weight;
}
function compute(t, v){
  const total = totalDough(t, v);
  const H = v.hydro, l = v.salt, d = v.fat, i = v.hours;
  const s = Math.max(0, Math.min(v.fridge, i - 1));
  const n = v.temp * (1 - 0.25 * (v.comp ? 1 : 0));            // temperatura usata nel calcolo
  const g = ({1:1/300, 2:0.005, 3:0.01})[v.pdrType] ?? 0.005;   // g di lievito equivalenti per g di pasta di riporto
  const c = i - 0.9 * s;                                        // ore equivalenti a temperatura ambiente
  const h = 2250 * (1 + l/200) * (1 + d/300) / ((4.2*H - 80 - 0.0305*H*H) * Math.pow(n, 2.5) * Math.pow(c, 1.2));
  const C = H * (l + d) + 1000 * (H + 100);
  const maxPdr = 1e5 * h * 100 / (1e5 * h + C * g);
  const pdrPct = Math.min(v.pdr || 0, maxPdr);
  const pdr = total * pdrPct / 100;
  const rest = total - pdr;
  const flour = 1e5 * rest / C;
  const water = 1000 * H * rest / C;
  const salt = l * H * rest / C;
  const fat = d * H * rest / C;
  const yeast = Math.max(0, flour * h - g * pdr);
  const W = 10 * Math.round((81.4206918743428 + 78.3939060802556 * Math.log(i)) / 10);
  return {total, flour, water, salt, fat, pdr, yeast, maxPdr, W, effHours:c, calcTemp:n, piece: t === "teglia" ? total / v.count : v.weight};
}

async function retryOnce(fn){
  try { return await fn(); }
  catch(e){ if (e && (e.code === "unavailable" || e.code === "store_unavailable")) { await new Promise(r => setTimeout(r, 600 + Math.random()*600)); return fn(); } throw e; }
}
function compress(file, max = 1400, q = 0.82){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      cv.toBlob(b => b ? resolve(b) : reject(new Error("toBlob")), "image/jpeg", q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("img")); };
    img.src = url;
  });
}
async function uploadPhoto(file){
  let blob; try { blob = await compress(file); } catch { blob = file; }
  const type = blob.type && /^image\/(jpeg|png|webp|gif)$/.test(blob.type) ? blob.type : "image/jpeg";
  const up = await retryOnce(() => assets.upload(blob, {type}));
  return up.id;
}

function fdef(t, k, v, r){
  const T = TYPES[t], d = {...BASE[k]};
  const rg = T.ranges && T.ranges[k]; if (rg){ d.min = rg[0]; d.max = rg[1]; d.step = rg[2]; }
  if (T.labels && T.labels[k]) d.label = T.labels[k];
  if (k === "fridge") d.max = Math.max(0, v.hours - 1);
  if (k === "pdr"){ const m = (r || compute(t, v)).maxPdr; d.max = Math.max(0, Math.min(50, Math.floor(m / 0.5) * 0.5)); }
  return d;
}
function fmtVal(d, val){
  if (d.dec === 2) return fmtFixed(val, 2) + " " + d.unit;
  return fmtNum(val, d.dec || 0) + (d.unit === "%" ? "%" : d.unit ? " " + d.unit : "");
}
function visible(t, v){
  return TYPES[t].fields.filter(k => {
    if (k === "length" || k === "width") return v.shape !== "tonda";
    if (k === "diam") return v.shape === "tonda";
    return true;
  });
}
function hintFor(t, k, v, r){
  const T = TYPES[t];
  switch(k){
    case "count": case "weight":
      if (t === "teglia") return "";
      return k === "weight" ? "Impasto totale " + fmtG(r.total) : "";
    case "load": return "≈ " + fmtG(r.piece) + " per teglia · 0,5 sottile, 0,7 alta";
    case "length": case "width": return "";
    case "diam": return "";
    case "hydro": return "";
    case "salt": return "";
    case "fat": return v.fat ? "≈ " + fmtNum(v.fat * v.hydro / 1000, 1) + "% sulla farina" : "Nessun grasso nell'impasto";
    case "pdr":
      if (r.maxPdr < 0.5) return "Con questi parametri non c'è spazio per la pasta di riporto.";
      return "Massimo " + fmtNum(r.maxPdr, 1) + "%: oltre servirebbe meno di zero lievito di birra." + (v.pdr ? " Ora: " + fmtG(r.pdr) + "." : "");
    case "hours": return "";
    case "fridge": return "";
    case "temp": return v.comp ? "Con la compensazione il calcolo usa " + fmtNum(r.calcTemp, 1) + " °C." : "";
    default: return "";
  }
}
function controlHtml(prefix, t, k, v, r){

function panelHtml(prefix, t, v, hide){
  const r = compute(t, v), vis = visible(t, v).filter(k => !(hide || []).includes(k));
  return GROUPS.map(([g, ks]) => {
    const fs = ks.filter(k => vis.includes(k));

    let h = '<section class="group"><h3>'+g+"</h3>" + main.map(k => controlHtml(prefix, t, k, v, r)).join("");
    if (adv.length){
      const st = advStatus(t, v);
      h += '<details class="adv"'+(advOpen ? " open" : "")+'><summary><b>'+(t === "pane" ? "Grassi e lievito madre" : "Grassi e pasta di riporto")+'</b><span class="st'+(st !== "non usati" ? " on" : "")+'">'+esc(st)+"</span></summary>" +
        '<div class="in">' + adv.map(k => controlHtml(prefix, t, k, v, r)).join("") + "</div></details>";
    }
    return h + "</section>";
  }).join("");
}
function mountPanel(root, prefix, t, v, onChange, hide){
  function clamp(){
    v.fridge = Math.min(v.fridge, Math.max(0, v.hours - 1));
    const m = fdef(t, "pdr", v).max;
    if (v.pdr > m) v.pdr = m;
  }
  function refresh(){
    clamp();
    const r = compute(t, v);
    root.querySelectorAll(".sl[data-k]:not([data-seg])").forEach(el => {
      const k = el.dataset.k, d = fdef(t, k, v, r), inp = el.querySelector("input[type=range]");
      if (Number(inp.max) !== d.max) inp.max = d.max;
      if (Number(inp.value) !== v[k]) inp.value = v[k];
      inp.disabled = d.max <= d.min;
      el.querySelector("output").textContent = fmtVal(d, v[k]);
      const h = el.querySelector(".hint"); if (h) h.textContent = hintFor(t, k, v, r);
    });
    const st = root.querySelector("details.adv .st");
    if (st){ const tx = advStatus(t, v); st.textContent = tx; st.classList.toggle("on", tx !== "non usati"); }
    if (onChange) onChange(r);
  }
  function draw(){ clamp(); root.innerHTML = panelHtml(prefix, t, v, hide); refresh(); }
  root.addEventListener("toggle", e => { if (e.target.matches && e.target.matches("details.adv")) advOpen = e.target.open; }, true);
  root.addEventListener("input", e => {
    const inp = e.target; if (inp.type !== "range") return;
    const k = inp.closest("[data-k]").dataset.k;
    v[k] = Number(inp.value); refresh();
  });
  root.addEventListener("click", e => {
    const st = e.target.closest(".step");
    if (st){
      const el = st.closest("[data-k]"), k = el.dataset.k, inp = el.querySelector("input[type=range]");
      if (inp.disabled) return;
      v[k] = snap(v[k] + Number(st.dataset.d) * Number(inp.step), Number(inp.min), Number(inp.max), Number(inp.step));
      refresh(); return;
    }
    const b = e.target.closest(".seg [data-v]");
    if (b){
      const seg = b.closest(".seg"), k = seg.dataset.k, d = BASE[k];
      v[k] = d.type === "bool" ? b.dataset.v === "1" : d.options.find(o => String(o[0]) === b.dataset.v)[0];

      seg.querySelectorAll("[data-v]").forEach(x => x.setAttribute("aria-checked", String(x === b)));
      refresh();
    }
  });
  draw();
  return {draw, refresh};
}

function wireChipPick(root, id, state, multi, onToggle){

/* ================= form impasto ================= */
function bakeForm(b, seed){
  if (!db){ toast("Accedi dalla pagina Registro per salvare gli impasti."); return; }
  const isNew = !b;
  const d = JSON.parse(JSON.stringify(b || seed));
  const t = d.type, T = TYPES[t] || TYPES.tonda;
  const lastSame = S.bakes.find(x => x.type === t && x.id !== d.id);
  d.scores = d.scores || {}; d.diag = d.diag || {};
  if (isNew){
    d.at = d.at || new Date().toISOString();
    if (lastSame){ d.oven = lastSame.oven || null; if (!d.flour) { d.flour = lastSame.flour || ""; d.flourW = lastSame.flourW || 0; } }
  }
  const vals = {
    flourW: d.flourW || 0,
    ovenTemp: d.ovenTemp ?? (lastSame && lastSame.ovenTemp) ?? T.oven.temp,
    bakeTime: d.bakeTime ?? (lastSame && lastSame.bakeTime) ?? T.oven.time,
    oven: d.oven || null,
  };
  for (const [k] of SCORES) vals["s_" + k] = d.scores[k] || 0;
  for (const k in DIAG) vals["d_" + k] = d.diag[k] || null;
  let rating = d.rating || 0;

// L'app passa al comando rapido "Promemoria pizza" una riga per promemoria: "minuti da adesso|titolo".
// Il comando crea ogni promemoria nella lista "Pizza" con l'avviso all'ora giusta.
const SHORTCUT = "Promemoria pizza";
const REM_KEY = "diario-pizza-rem";
const STAGLIO = {tonda:"Staglio dei panielli", romana:"Staglio dei panielli", teglia:"Staglio per le teglie", pane:"Formatura delle pagnotte"};
const DINNER = t => t === "pane" ? "Fine lievitazione" : "Ora di cena";
function remPrefs(){ try { return JSON.parse(localStorage.getItem(REM_KEY) || "{}") || {}; } catch { return {}; } }
function saveRemPrefs(o){ try { localStorage.setItem(REM_KEY, JSON.stringify(o)); } catch {} }
const fmtHM = d => d.toLocaleTimeString("it-IT", {hour:"2-digit", minute:"2-digit"});
const dayIndex = d => Math.round((new Date(d).setHours(0,0,0,0) - new Date().setHours(0,0,0,0)) / 864e5);
const dayName = (i, d) => i === 0 ? "oggi" : i === 1 ? "domani" : i === 2 ? "dopodomani" : d.toLocaleDateString("it-IT", {weekday:"long", day:"numeric", month:"short"});
const fmtDayHM = d => dayName(dayIndex(d), d) + " alle " + fmtHM(d);
const hm = m => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
function postMax(v){ const I = v.hours, F = Math.min(v.fridge, I - 1); return F > 0 ? I - F : I; }
// ore tra staglio e cena, se non scelte: con il frigo, quelle che restano dopo pieghe + frigo; senza frigo, circa il 40% della lievitazione
function autoPost(v, folds, gap){
  const I = v.hours, F = Math.min(v.fridge, I - 1), foldsH = folds * gap / 60;
  const x = F > 0 ? I - F - foldsH : Math.min(I - foldsH, I * 0.4);
  return Math.max(0, Math.min(postMax(v), Math.round(x * 2) / 2));
}
function buildPlan(t, v, st){
  const I = v.hours, F = Math.min(v.fridge, I - 1);
  const base = new Date(); base.setHours(0, 0, 0, 0); base.setDate(base.getDate() + st.day);
  const anchor = new Date(base.getTime() + st.minutes * 60000);
  const start = st.anchor === "start" ? anchor : new Date(anchor.getTime() - I * 3600e3);
  const dinner = new Date(start.getTime() + I * 3600e3);
  const post = Math.min(v.post, postMax(v));
  const staglio = new Date(dinner.getTime() - post * 3600e3);
  const fridgeIn = F > 0 ? new Date(staglio.getTime() - F * 3600e3) : null;
  const items = [];
  for (let i = 1; i <= v.folds; i++) items.push({k:"fold" + i, title:"Pieghe di rinforzo (" + i + "ª di " + v.folds + ")", at:new Date(start.getTime() + i * v.foldGap * 60000)});
  if (fridgeIn) items.push({k:"fridge", title:"Metti l'impasto in frigo", at:fridgeIn, optional:true});
  items.push({k:"staglio", title:STAGLIO[t] + (F > 0 ? ": togli l'impasto dal frigo" : ""), at:staglio});
  items.push({k:"oven", title:"Accendi il forno", at:new Date(dinner.getTime() - v.ovenLead * 60000)});
  items.sort((a, b) => a.at - b.at);
  const lastFold = v.folds ? new Date(start.getTime() + v.folds * v.foldGap * 60000) : null;
  const warn = lastFold && lastFold > (fridgeIn || staglio) ? (fridgeIn ? "Le pieghe finiscono dopo l'ingresso in frigo: aumenta le ore fuori dal frigo o riduci le pieghe." : "Le pieghe finiscono dopo lo staglio.") : "";
  return {start, dinner, staglio, fridgeIn, items, warn, F};
}

    '<details class="how"><summary>Prima volta? Crea il comando rapido</summary><p>Serve una sola volta, su iPhone (e se vuoi anche sul Mac). L\'app passa al comando “'+SHORTCUT+'” l\'elenco dei promemoria e il comando li crea nell\'app Promemoria.</p><ol>' +

    '<div class="chips">' + [x.base ? '<span class="pill">'+esc(x.base)+"</span>" : "", ...(x.types || []).map(k => TYPES[k] ? '<span class="pill">'+esc(TYPES[k].label)+"</span>" : ""), ...(x.tags || []).map(t => '<span class="pill tag">'+esc(t)+"</span>")].join("") + "</div>" +
    (x.rating ? "<div>"+stars(x.rating)+"</div>" : "") +
    (lines(x.before).length ? '<div class="box"><h3>Prima della cottura</h3><ul>'+lines(x.before).map(l => "<li>"+esc(l)+"</li>").join("")+"</ul></div>" : "") +
    (lines(x.after).length ? '<div class="box"><h3>In uscita</h3><ul>'+lines(x.after).map(l => "<li>"+esc(l)+"</li>").join("")+"</ul></div>" : "") +
    (x.notes ? '<div class="box"><h3>Note</h3><p class="prose">'+esc(x.notes)+"</p></div>" : "") +
    '<div class="actions"><button class="btn primary" data-x="edit">Modifica</button></div>';
  const s = openSheet(x.name, inner);
  s.el.querySelector('[data-x="edit"]').onclick = () => { s.close(); toppingForm(x); };
}
function toppingForm(x){
  if (!db){ toast("Accedi dalla pagina Gusti per salvare."); return; }
  const isNew = !x; x = x || {};
  const vals = {base: x.base || null};
  const typeSt = {sel: (x.types || []).map(k => TYPES[k] ? TYPES[k].tab : null).filter(Boolean)};
  const tagSt = {sel: [...(x.tags || [])]};
  let rating = x.rating || 0;
  const inner = '<form id="tp" novalidate>' + photoBlock("tp-photo", x.photo, "Aggiungi una foto") +
    '<div class="field"><label for="tp-name">Nome *</label><input type="text" id="tp-name" value="'+esc(x.name || "")+'" placeholder="es. Patate, salsiccia e provola"></div>' +
    segHtml("base", "Base", BASES, vals.base) +
    '<div class="field"><span class="flabel">Adatta a</span><div class="chips" id="tp-types">' + TYPE_KEYS.map(k => '<button type="button" class="chip" data-c="'+TYPES[k].tab+'" aria-pressed="'+typeSt.sel.includes(TYPES[k].tab)+'">'+TYPES[k].tab+"</button>").join("") + "</div></div>" +
    '<div class="field"><span class="flabel">Tag</span>' + chipPickHtml("tp-tags", allTags(), tagSt.sel, "Nuovo tag…") + "</div>" +
    '<div class="field"><label for="tp-before">Prima della cottura <span class="muted">(uno per riga)</span></label><textarea id="tp-before" placeholder="Fior di latte&#10;Salsiccia&#10;Patate a fette sottili">'+esc(x.before || "")+"</textarea></div>" +
    '<div class="field"><label for="tp-after">In uscita <span class="muted">(uno per riga)</span></label><textarea id="tp-after" placeholder="Basilico&#10;Olio a crudo">'+esc(x.after || "")+"</textarea></div>" +
    ratingHtml("tp-rating", "Quanto ci piace") +
    '<div class="field"><label for="tp-notes">Note</label><textarea id="tp-notes" placeholder="Dove l\'abbiamo assaggiata, varianti, abbinamenti…">'+esc(x.notes || "")+"</textarea></div>" +
    '<div class="form-foot">' + (isNew ? "<span></span>" : '<button type="button" class="btn danger" id="tp-del">Elimina gusto</button>') +
    '<button type="submit" class="btn primary" id="tp-save">'+(isNew ? "Aggiungi" : "Salva")+"</button></div></form>";
  const s = openSheet(isNew ? "Nuovo gusto" : "Modifica gusto", inner);
  const $ = q => s.el.querySelector(q);
  const form = $("#tp");
  wireSegs(form, vals);
  // tipi: multi-selezione senza campo "aggiungi"
  $("#tp-types").addEventListener("click", e => {
    const c = e.target.closest("[data-c]"); if (!c) return;
    const v = c.dataset.c, on = typeSt.sel.includes(v);
    typeSt.sel = on ? typeSt.sel.filter(y => y !== v) : [...typeSt.sel, v];
    c.setAttribute("aria-pressed", String(!on));
  });
  wireChipPick(form, "tp-tags", tagSt, true, (tag, on) => {
    if (tag === "Vegana" && on){ for (const t of ["Vegetariana", "Senza lattosio"]) if (!tagSt.sel.includes(t)) tagSt.sel.push(t); }
  });
  wireRating($("#tp-rating"), () => rating, v => { rating = v; });
  const ph = wirePhoto(form, "tp-photo", "Aggiungi una foto");
  if (isNew) setTimeout(() => $("#tp-name").focus(), 50);
  const del = $("#tp-del");
  if (del) del.addEventListener("click", async () => {
    if (!(await confirmBox("Eliminare “" + x.name + "”? Non si può annullare.", "Elimina"))) return;
    try { await retryOnce(() => db.collection("toppings").doc(x.id).delete()); if (x.photo && assets) assets.delete(x.photo).catch(() => {}); s.close(); toast("Gusto eliminato"); }
    catch(e){ toast(errMsg(e)); }
  });
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const name = $("#tp-name").value.trim();
    if (!name){ $("#tp-name").focus(); toast("Scrivi il nome del gusto"); return; }
    const btn = $("#tp-save"); btn.disabled = true; btn.textContent = ph.file ? "Carico la foto…" : "Salvo…";
    try {
      let photo = ph.remove ? null : (x.photo || null); const old = x.photo || null;
      if (ph.file && assets) photo = await uploadPhoto(ph.file);
      const data = {
        name, base: vals.base || null,
        types: TYPE_KEYS.filter(k => typeSt.sel.includes(TYPES[k].tab)),
        tags: tagSt.sel, before: $("#tp-before").value.trim(), after: $("#tp-after").value.trim(),
        notes: $("#tp-notes").value.trim(), rating, photo, createdAt: x.createdAt || new Date().toISOString(),
      };
      const id = x.id || uid("t");
      await retryOnce(() => db.collection("toppings").doc(id).set(data));
      if (old && old !== photo && assets) assets.delete(old).catch(() => {});
      s.close(); toast(isNew ? "Gusto aggiunto" : "Modifiche salvate");
    } catch(err){ btn.disabled = false; btn.textContent = isNew ? "Aggiungi" : "Salva"; toast(errMsg(err)); }
  });
}

let defDraft = null;
function renderDefaults(){
  const t = S.defType, T = TYPES[t];
  defDraft = {...defaultsFor(t)};
  const saved = S.defaults[t] && S.defaults[t].updatedAt;
  let html = '<header class="top"><div><h1>Valori predefiniti</h1><p>Il punto di partenza di ogni nuovo impasto</p></div></header>' +
    '<div class="types" role="tablist" aria-label="Tipo di impasto">' + TYPE_KEYS.map(k => '<button type="button" role="tab" data-dtype="'+k+'"'+(k===t?' aria-current="true" aria-selected="true"':' aria-selected="false"')+">"+IC[k]+"<span>"+TYPES[k].tab+"</span></button>").join("") + "</div>" +
    '<p class="lead">'+esc(T.label)+": "+(saved ? "valori personalizzati, salvati il " + fmtDate(saved) + "." : "valori di fabbrica.")+"</p>";
  if (S.needLogin) html += loginHtml();
  else if (S.noDb) html += '<div class="notice"><p>Configurazione mancante: inserisci l\'indirizzo e la chiave di Supabase nel file config.js.</p></div>';
  else if (S.error) html += '<div class="notice"><p>'+esc(S.error)+'</p></div>';
  html += '<div id="dpanel" class="group"></div>' +
    '<div class="actions"><button class="btn primary" data-act="save-def"'+(db ? "" : " disabled")+'>Salva predefiniti</button><button class="btn" data-act="factory"'+(db && saved ? "" : " disabled")+'>Torna ai valori di fabbrica</button></div>';
  html += footerHtml();
  app.innerHTML = html;
  wireLogin();
  mountPanel(document.getElementById("dpanel"), "d", t, defDraft, null);
}
async function saveDefaults(t, vals){
  const clean = {}; for (const k of Object.keys(TYPES[t].defaults)) clean[k] = vals[k];
  await retryOnce(() => db.collection("defaults").doc(t).set({vals:clean, updatedAt:new Date().toISOString()}));
}

/* ================= click globali ================= */
app.addEventListener("click", async e => {
  const el = e.target.closest("[data-act],[data-bake],[data-bfilter],[data-top],[data-tagf],[data-tyf],[data-dtype],[data-load]");
  if (!el) return;
  if (el.dataset.bake){ const b = S.bakes.find(x => x.id === el.dataset.bake); if (b) bakeDetail(b); return; }
  if (el.dataset.load){ const b = S.bakes.find(x => x.id === el.dataset.load); if (b) loadBakeIntoCalc(b); return; }
  if (el.dataset.bfilter){ S.bakeFilter = el.dataset.bfilter; render(); return; }
  if (el.dataset.top){ const x = S.toppings.find(y => y.id === el.dataset.top); if (x) toppingDetail(x); return; }
  if (el.dataset.tagf){ const t = el.dataset.tagf; S.tagFilter.has(t) ? S.tagFilter.delete(t) : S.tagFilter.add(t); render(); return; }
  if (el.dataset.tyf){ S.typeFilter = S.typeFilter === el.dataset.tyf ? null : el.dataset.tyf; render(); return; }
  if (el.dataset.dtype){ S.defType = el.dataset.dtype; render(); return; }
  const act = el.dataset.act, t = calcType;
  if (act === "reminders") remindersSheet();
  else if (act === "save-bake"){
    const v = getCalc(t), r = compute(t, v);
    bakeForm(null, {type:t, params:{...v}, results:roundResults(r)});
  } else if (act === "reset"){
    calc[t] = defaultsFor(t); delete touched[t]; saveLocal(); renderCalc(); toast("Predefiniti ripristinati");
  } else if (act === "as-default"){
    if (!db){ toast("Accedi dalla pagina Predefiniti per salvarli."); return; }
    if (!(await confirmBox("Usare questi valori come predefiniti per " + TYPES[t].label.toLowerCase() + "?", "Salva", true))) return;
    try { await saveDefaults(t, getCalc(t)); toast("Predefiniti salvati"); } catch(err){ toast(errMsg(err)); }
  } else if (act === "save-def"){
    const dt = S.defType;
    try { el.disabled = true; await saveDefaults(dt, defDraft); if (!touched[dt]) calc[dt] = null; toast("Predefiniti salvati per " + TYPES[dt].label.toLowerCase()); }
    catch(err){ el.disabled = false; toast(errMsg(err)); }
  } else if (act === "factory"){
    const dt = S.defType;
    if (!(await confirmBox("Tornare ai valori di fabbrica per " + TYPES[dt].label.toLowerCase() + "?", "Ripristina"))) return;
    try { await retryOnce(() => db.collection("defaults").doc(dt).delete()); if (!touched[dt]) calc[dt] = null; toast("Valori di fabbrica ripristinati"); }
    catch(err){ toast(errMsg(err)); }
  } else if (act === "new-top") toppingForm(null);
  else if (act === "clear-f"){ S.tagFilter.clear(); S.typeFilter = null; render(); }
  else if (act === "export") exportBackup(el);
  else if (act === "import") importBackup();
  else if (act === "logout") logout();
});

/* ================= sheet ================= */
function openSheet(title, inner, cls){
  const ov = document.createElement("div");
  ov.className = "overlay" + (cls ? " " + cls : "");
  ov.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="sheet-head"><h2>'+esc(title)+'</h2><button class="btn ghost" data-close>Chiudi</button></div>'+inner+"</div>";
  document.body.appendChild(ov);
  document.body.style.overflow = "hidden";
  const close = () => { ov.remove(); if (!document.querySelector(".overlay")) document.body.style.overflow = ""; };
  ov.addEventListener("click", e => { if (e.target === ov || e.target.closest("[data-close]")) close(); });
  ov.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
  return {el: ov, close};
}
function confirmBox(text, okLabel, safe){
  return new Promise(res => {
    let done = false; const fin = v => { if (!done){ done = true; res(v); } };
    const s = openSheet("Conferma", '<p style="margin:0">'+esc(text)+'</p><div class="form-foot"><button class="btn" data-no>Annulla</button><button class="btn primary" data-yes'+(safe ? "" : ' style="background:var(--danger);border-color:var(--danger)"')+">"+esc(okLabel)+"</button></div>");
    s.el.querySelector("[data-no]").onclick = () => { s.close(); fin(false); };
    s.el.querySelector("[data-yes]").onclick = () => { s.close(); fin(true); };
    s.el.addEventListener("click", e => { if (e.target === s.el || e.target.closest("[data-close]")) fin(false); });
  });
}

/* ================= backup ================= */
const blobToDataURL = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
async function withPhotos(list){
  const out = [];
  for (const x of list){
    const o = {...x};
    if (x.photo){ try { const r = await fetch(photoUrl(x.photo)); if (r.ok) o.photoData = await blobToDataURL(await r.blob()); } catch {} }
    out.push(o);
  }
  return out;
}
const backupName = () => "diario-pizza-backup-" + new Date().toISOString().slice(0,10) + ".json";
async function exportBackup(el){
  const old = el.textContent; el.disabled = true; el.textContent = "Preparo il file…";
  try {
    const json = JSON.stringify({app:"diario-pizza", version:1, exportedAt:new Date().toISOString(), defaults:S.defaults, bakes:await withPhotos(S.bakes), toppings:await withPhotos(S.toppings)});
    const name = backupName(), file = new File([json], name, {type:"application/json"});
    if (navigator.canShare && navigator.canShare({files:[file]})){
      try { await navigator.share({files:[file], title:name}); } catch(e){ if (e && e.name === "AbortError") return; throw e; }
      await recordBackup(); toast("Backup pronto");
    } else {
      const url = URL.createObjectURL(file), a = document.createElement("a");
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      await recordBackup(); toast("Backup scaricato");
    }
  } catch { toast("Esportazione non riuscita. Riprova."); }
  finally { el.disabled = false; el.textContent = old; }
}
function importBackup(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.addEventListener("change", async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    let data;
    try { data = JSON.parse(await f.text()); } catch { toast("Il file non è un backup valido."); return; }
    if (!data || data.app !== "diario-pizza" || !Array.isArray(data.bakes) || !Array.isArray(data.toppings)){ toast("Il file non è un backup del Diario pizza."); return; }
    if (!(await confirmBox("Importare " + data.bakes.length + " impasti, " + data.toppings.length + " gusti e i predefiniti? Se un elemento è già presente viene sostituito dalla versione del file.", "Importa", true))) return;
    toast("Importazione in corso…");
    try {
      const now = new Date().toISOString();
      const withPhoto = async list => {
        const rows = [];
        for (const x of list){
          if (!x || !x.id) continue;
          const {id, photoData, ...rest} = x;
          let photo = rest.photo && String(rest.photo).includes("/") ? rest.photo : null;
          if (photoData){ try { const blob = await (await fetch(photoData)).blob(); photo = (await retryOnce(() => assets.upload(blob, {type: blob.type || "image/jpeg"}))).id; } catch {} }
          rows.push({id:String(id), data:{...rest, photo}, updated_at:now});
        }
        return rows;
      };
      const defRows = Object.entries(data.defaults || {}).filter(([k]) => TYPES[k]).map(([k, v]) => ({id:k, data:v, updated_at:now}));
      const bakeRows = await withPhoto(data.bakes), topRows = await withPhoto(data.toppings);
      for (const [table, rows] of [[TABLES.defaults, defRows], [TABLES.bakes, bakeRows], [TABLES.toppings, topRows]]){
        for (let i = 0; i < rows.length; i += 200){ const {error} = await sb.from(table).upsert(rows.slice(i, i + 200)); if (error) throw wrapErr(error); }
      }
      await refresh(true);
      toast("Importati " + bakeRows.length + " impasti e " + topRows.length + " gusti");
    } catch(e){ toast(errMsg(e)); }
  });
  inp.click();
}

/* ================= Supabase: archivio, foto, accesso ================= */
let sb = null, session = null;
const CACHE_KEY = "diario-pizza-cache-v1";
const TABLES = {defaults:"pizza_defaults", bakes:"pizza_bakes", toppings:"pizza_toppings"};
const KIND = {defaults:"d", bakes:"b", toppings:"t"};
function wrapErr(error){
  const m = String((error && error.message) || "");
  const st = error && (error.status || error.statusCode);
  if (!navigator.onLine || /fetch|network|load failed/i.test(m)) return {code:"unavailable", message:m};
  if (st == 401 || st == 403 || (error && error.code === "42501")) return {code:"invalid_argument", message:m};
  if (st == 413) return {code:"too_large", message:m};
  if (error && error.code === "42P01") return {code:"no_table", message:m};
  return {code:"error", message:m};
}
const sortBakes = () => S.bakes.sort((a, b) => (b.at || "").localeCompare(a.at || ""));
let cacheTimer = null;
function saveCache(){
  clearTimeout(cacheTimer);
  cacheTimer = setTimeout(() => {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({u: session && session.user.id, defaults:S.defaults, bakes:S.bakes, toppings:S.toppings})); } catch {}
  }, 300);
}
function loadCache(){
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
    if (!c || !session || c.u !== session.user.id) return false;
    S.defaults = c.defaults || {}; S.bakes = c.bakes || []; S.toppings = c.toppings || []; sortBakes();
    S.loaded = {d:true, b:true, t:true}; return true;
  } catch { return false; }
}
function applyRow(col, id, data){
  if (col === "defaults"){ if (data) S.defaults[id] = data; else delete S.defaults[id]; }
  else { S[col] = S[col].filter(x => x.id !== id); if (data) S[col].push({id, ...data}); if (col === "bakes") sortBakes(); }
  saveCache(); onData(KIND[col]);
}
function makeDb(){
  return { collection(col){ return { doc(id){ return {
    async set(data){
      const {error} = await sb.from(TABLES[col]).upsert({id, data, updated_at:new Date().toISOString()});
      if (error) throw wrapErr(error);
      applyRow(col, id, data);
    },
    async delete(){
      const {error} = await sb.from(TABLES[col]).delete().eq("id", id);
      if (error) throw wrapErr(error);
      applyRow(col, id, null);
    },
  }; } }; } };
}
function makeAssets(){
  return {
    async upload(blob, opts){
      const type = (opts && opts.type) || blob.type || "image/jpeg";
      const ext = type === "image/png" ? "png" : type === "image/webp" ? "webp" : type === "image/gif" ? "gif" : "jpg";
      const path = session.user.id + "/pizza/" + uid("p") + "." + ext;
      const {error} = await sb.storage.from("photos").upload(path, blob, {contentType:type, cacheControl:"31536000", upsert:false});
      if (error) throw wrapErr(error);
      return {id: path};
    },
    async delete(path){ if (path && path.includes("/")) await sb.storage.from("photos").remove([path]); },
  };
}
async function fetchAll(table){
  const out = [];
  for (let from = 0; ; from += 1000){
    const {data, error} = await sb.from(table).select("id,data").range(from, from + 999);
    if (error) throw wrapErr(error);
    out.push(...data);
    if (data.length < 1000) break;
  }
  return out;
}
let refreshing = false;
async function refresh(force){
  if (refreshing) return; refreshing = true;
  const before = {d:JSON.stringify(S.defaults), b:JSON.stringify(S.bakes), t:JSON.stringify(S.toppings)};
  const first = !(S.loaded.d && S.loaded.b && S.loaded.t);
  try {
    const [d, b, t] = await Promise.all([fetchAll(TABLES.defaults), fetchAll(TABLES.bakes), fetchAll(TABLES.toppings)]);
    S.defaults = Object.fromEntries(d.map(r => [r.id, r.data || {}]));
    S.bakes = b.map(r => ({id:r.id, ...(r.data || {})})); sortBakes();
    S.toppings = t.map(r => ({id:r.id, ...(r.data || {})}));
    S.loaded = {d:true, b:true, t:true}; S.offline = false; S.error = null;
    saveCache();
    if (first || force){ onData("d"); onData("init"); return; }
    if (JSON.stringify(S.defaults) !== before.d) onData("d");
    if (JSON.stringify(S.bakes) !== before.b) onData("b");
    if (JSON.stringify(S.toppings) !== before.t) onData("t");
  } catch(e){
    S.offline = true;
    if (first){
      S.error = e && e.code === "no_table"
        ? "Le tabelle della pizza non esistono ancora su Supabase: esegui il file supabase/schema.sql nel SQL Editor (vedi README)."
        : "Non riesco a raggiungere l'archivio. Controlla la connessione e riapri l'app.";
      onData("err");
    }
  } finally { refreshing = false; }
}
let channel = null;
function subscribe(){
  if (channel) return;
  const onChange = col => p => {
    if (p.eventType === "DELETE"){ if (p.old && p.old.id) applyRow(col, p.old.id, null); }
    else if (p.new && p.new.id) applyRow(col, p.new.id, p.new.data);
  };
  let ch = sb.channel("diario-pizza");
  for (const col of Object.keys(TABLES)) ch = ch.on("postgres_changes", {event:"*", schema:"public", table:TABLES[col]}, onChange(col));
  channel = ch.subscribe();
}
async function startData(){
  S.needLogin = false;
  sb.auth.getUser().then(({data}) => { if (data && data.user && session) session = {...session, user:data.user}; }).catch(() => {});
  db = makeDb(); assets = makeAssets();
  if (loadCache()) onData("init"); else onData("init");
  await refresh();
  subscribe();
}

/* ================= accesso ================= */
function loginHtml(){
  return '<form class="login" id="login" novalidate><p style="margin:0">Accedi con lo stesso account del Diario caffè per vedere registro, gusti e predefiniti su tutti i dispositivi. Il calcolatore funziona anche senza accesso.</p>' +
    '<div class="field"><label for="lg-email">Email</label><input type="text" inputmode="email" autocomplete="username" autocapitalize="off" id="lg-email"></div>' +
    '<div class="field"><label for="lg-pass">Password</label><input type="password" autocomplete="current-password" id="lg-pass"></div>' +
    '<p class="err" id="lg-err" hidden></p>' +
    '<button class="btn primary" type="submit" id="lg-go" style="align-self:flex-start">Accedi</button></form>';
}
function wireLogin(){
  const f = document.getElementById("login"); if (!f) return;
  f.addEventListener("submit", async e => {
    e.preventDefault();
    const err = document.getElementById("lg-err"), btn = document.getElementById("lg-go");
    const email = document.getElementById("lg-email").value.trim(), password = document.getElementById("lg-pass").value;
    if (!email || !password){ err.hidden = false; err.textContent = "Inserisci email e password."; return; }
    btn.disabled = true; btn.textContent = "Accesso…"; err.hidden = true;
    const {data, error} = await sb.auth.signInWithPassword({email, password});
    if (error){
      btn.disabled = false; btn.textContent = "Accedi"; err.hidden = false;
      err.textContent = /invalid/i.test(error.message) ? "Email o password non corrette." : "Accesso non riuscito: controlla la connessione e riprova.";
      return;
    }
    session = data.session; startData();
  });
}
async function logout(){
  if (!(await confirmBox("Uscire dal diario su questo dispositivo? I dati restano salvati online.", "Esci"))) return;
  try { await sb.auth.signOut(); } catch {}
  try { localStorage.removeItem(CACHE_KEY); } catch {}
  if (channel){ sb.removeChannel(channel); channel = null; }
  session = null; db = null; assets = null;
  S.defaults = {}; S.bakes = []; S.toppings = []; S.loaded = {d:false, b:false, t:false}; S.needLogin = true;
  for (const k of TYPE_KEYS) if (!touched[k]) calc[k] = null;
  render();
}

/* ================= promemoria backup ================= */
const BACKUP_EVERY_DAYS = 14;
const lastBackup = () => (session && session.user && session.user.user_metadata && session.user.user_metadata.lastBackupPizza) || null;
function nudgeHtml(){
  if (!session || !(S.bakes.length || S.toppings.length)) return "";
  const lb = lastBackup();
  const days = lb ? Math.floor((Date.now() - new Date(lb).getTime()) / 864e5) : null;
  if (days != null && days < BACKUP_EVERY_DAYS) return "";
  const txt = lb ? "Ultimo backup " + (days === 1 ? "ieri" : days + " giorni fa") : "Non hai ancora fatto un backup";
  return '<div class="nudge" role="status"><span>' + txt + '. Salvane una copia su iCloud Drive.</span><button class="btn small" data-act="export">Esporta ora</button></div>';
}
async function recordBackup(){
  const at = new Date().toISOString();
  try {
    const {data, error} = await sb.auth.updateUser({data:{lastBackupPizza:at}});
    if (!error && data && data.user && session) session = {...session, user:data.user};
  } catch {}
  if (session && session.user) session.user.user_metadata = {...(session.user.user_metadata || {}), lastBackupPizza:at};
  if (currentView() !== "predefiniti") render();
}
function footerHtml(){
  if (!db) return "";
  return '<footer class="foot"><button class="btn" data-act="export">Esporta backup</button><button class="btn" data-act="import">Importa backup</button><button class="btn" data-act="logout">Esci</button>' +
    (session ? '<span class="who">Accesso come ' + esc(session.user.email || "") + (lastBackup() ? " · ultimo backup " + fmtDate(lastBackup()) : "") + "</span>" : "") +
    '<span class="who">Il backup contiene predefiniti, registro e gusti, con le foto.</span></footer>';
}

/* ================= avvio ================= */
loadLocal();
render();
function onData(kind){
  const vw = currentView();
  if (TYPES[vw]){
    if ((kind === "d" || kind === "init") && !touched[vw]) { calc[vw] = defaultsFor(vw); renderCalc(); }
    else updatePrefill();
    for (const k of TYPE_KEYS) if (!touched[k] && k !== vw) calc[k] = null;
    return;
  }
  if (kind === "d") for (const k of TYPE_KEYS) if (!touched[k]) calc[k] = null;
  if (vw === "predefiniti" && kind !== "d" && kind !== "init" && kind !== "err") return;   // non perdere modifiche in corso
  render();
}
if ("serviceWorker" in navigator && location.protocol === "https:"){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && db) refresh(); });
window.addEventListener("online", () => { if (db) refresh(); });
(async () => {
  if (!CFG.supabaseUrl || !CFG.supabaseKey || !window.supabase){ S.noDb = true; onData("init"); return; }
  sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, {auth:{persistSession:true, autoRefreshToken:true}});
  const {data} = await sb.auth.getSession();
  session = data && data.session;
  sb.auth.onAuthStateChange((_evt, s) => { if (s) session = s; });
  if (!session){ S.needLogin = true; onData("init"); return; }
  startData();
})();
})();
</script>
</body>
</html>
